```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Financial Intelligence Platform</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{box-sizing:border-box;font-family:Segoe UI}

body{
margin:0;
background:#0f172a;
color:#e5e7eb;
}

/* HEADER */

header{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
background:#020617;
border-bottom:1px solid #1e293b;
}

header h1{
color:#38bdf8;
letter-spacing:1px;
font-size:20px;
}

/* SIDEBAR */

.sidebar{
position:fixed;
top:70px;
bottom:0;
width:230px;
background:#020617;
padding:20px;
border-right:1px solid #1e293b;
}

.sidebar button{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:8px;
background:#1e293b;
color:#e5e7eb;
font-weight:600;
cursor:pointer;
}

.sidebar button:hover{
background:#2563eb;
}

/* MAIN */

.main{
margin-left:230px;
padding:25px;
}

/* FILTER BAR */

.filters{
display:flex;
gap:15px;
margin-bottom:25px;
}

select,input{
padding:8px;
border-radius:6px;
border:none;
}

/* KPI GRID */

.kpis{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.card{
padding:22px;
border-radius:12px;
background:linear-gradient(145deg,#1e293b,#020617);
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.card h4{
color:#94a3b8;
font-size:13px;
margin-bottom:10px;
}

.card h2{
color:#22c55e;
font-size:28px;
margin:0;
}

.growth{
font-size:12px;
color:#facc15;
}

/* CHART */

.chart-card{
background:#020617;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

canvas{
height:320px !important;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:10px;
text-align:left;
border-bottom:1px solid #1e293b;
}

/* PAGE */

.page{display:none}
.active{display:block}

/* LIGHT MODE */

.light{
background:#f4f6f9;
color:#1e293b;
}

.light header{background:white}
.light .sidebar{background:white}
.light .chart-card{background:white}
.light .card{background:white}

</style>
</head>

<body>

<header>

<h1>FINANCIAL INTELLIGENCE PLATFORM</h1>

<div>

<input type="file" id="csvFile">
<button onclick="toggleMode()">🌙 / ☀</button>

</div>

</header>

<div class="sidebar">

<button onclick="showPage('overview')">Executive Overview</button>
<button onclick="showPage('profit')">Profitability</button>
<button onclick="showPage('balance')">Balance Sheet</button>
<button onclick="showPage('ranking')">Company Ranking</button>
<button onclick="showPage('heatmap')">Profit Heatmap</button>

</div>

<div class="main">

<div class="filters">

<select id="monthFilter"></select>
<select id="companyFilter"></select>
<select id="costFilter"></select>

</div>

<!-- OVERVIEW -->

<div id="overview" class="page active">

<div class="kpis">

<div class="card">
<h4>Total Revenue</h4>
<h2 id="salesKPI">$0</h2>
<div class="growth" id="salesGrowth"></div>
</div>

<div class="card">
<h4>Net Profit</h4>
<h2 id="profitKPI">$0</h2>
<div class="growth" id="profitGrowth"></div>
</div>

<div class="card">
<h4>Gross Margin</h4>
<h2 id="marginKPI">0%</h2>
</div>

<div class="card">
<h4>Current Ratio</h4>
<h2 id="ratioKPI">0</h2>
</div>

</div>

<div class="chart-card">
<canvas id="salesTrend"></canvas>
</div>

</div>

<!-- PROFITABILITY -->

<div id="profit" class="page">

<div class="chart-card">
<canvas id="profitTrend"></canvas>
</div>

<div class="chart-card">
<canvas id="expenseBreakdown"></canvas>
</div>

</div>

<!-- BALANCE -->

<div id="balance" class="page">

<div class="chart-card">
<canvas id="balanceChart"></canvas>
</div>

</div>

<!-- COMPANY RANKING -->

<div id="ranking" class="page">

<div class="chart-card">
<canvas id="companyRanking"></canvas>
</div>

</div>

<!-- HEATMAP -->

<div id="heatmap" class="page">

<div class="chart-card">

<h3>Profit Margin by Cost Center</h3>

<table id="heatTable"></table>

</div>

</div>

</div>

<script>

let rawData=[]

document.getElementById("csvFile").addEventListener("change",function(e){

Papa.parse(e.target.files[0],{
header:true,
complete:function(results){

rawData=results.data

populateFilters()
updateDashboard()

}
})

})

function populateFilters(){

let months=[...new Set(rawData.map(d=>d.Month))]
let companies=[...new Set(rawData.map(d=>d.Company))]
let costs=[...new Set(rawData.map(d=>d["Cost Center"]))]

fill("monthFilter",months)
fill("companyFilter",companies)
fill("costFilter",costs)

}

function fill(id,arr){

let s=document.getElementById(id)

s.innerHTML="<option value='All'>All</option>"

arr.forEach(v=>{
let o=document.createElement("option")
o.value=v
o.text=v
s.appendChild(o)
})

s.onchange=updateDashboard

}

function filtered(){

let m=monthFilter.value
let c=companyFilter.value
let cc=costFilter.value

return rawData.filter(d=>

(m=="All"||d.Month==m)&&
(c=="All"||d.Company==c)&&
(cc=="All"||d["Cost Center"]==cc)

)

}

function sum(data,key){

return data.reduce((a,b)=>a+Number(b[key]||0),0)

}

function updateDashboard(){

let d=filtered()

let sales=sum(d,"Sales")
let cogs=sum(d,"COGS")
let exp=sum(d,"Operating Expenses")

let profit=sales-cogs-exp

let assets=sum(d,"Assets")
let liabilities=sum(d,"Liabilities")

let currentAssets=sum(d,"Current Assets")
let currentLiab=sum(d,"Current Liabilities")

salesKPI.innerText="$"+sales.toLocaleString()
profitKPI.innerText="$"+profit.toLocaleString()

marginKPI.innerText=((profit/sales)*100).toFixed(1)+"%"

ratioKPI.innerText=(currentAssets/currentLiab).toFixed(2)

buildCharts(d)
buildRanking(d)
buildHeatmap(d)

}

let charts={}

function create(id,type,labels,data){

if(charts[id])charts[id].destroy()

charts[id]=new Chart(document.getElementById(id),{

type:type,

data:{
labels:labels,
datasets:[{
data:data,
borderColor:"#38bdf8",
backgroundColor:"#22c55e",
tension:0.4
}]
},

options:{responsive:true,maintainAspectRatio:false}

})

}

function buildCharts(d){

let months=[...new Set(d.map(x=>x.Month))]

let sales=months.map(m=>sum(d.filter(x=>x.Month==m),"Sales"))

create("salesTrend","line",months,sales)

let profit=months.map(m=>{
let r=d.filter(x=>x.Month==m)
return sum(r,"Sales")-sum(r,"COGS")-sum(r,"Operating Expenses")
})

create("profitTrend","line",months,profit)

create("expenseBreakdown","bar",
["COGS","Expenses"],
[
sum(d,"COGS"),
sum(d,"Operating Expenses")
])

create("balanceChart","bar",
["Assets","Liabilities"],
[
sum(d,"Assets"),
sum(d,"Liabilities")
])

}

function buildRanking(d){

let companies=[...new Set(d.map(x=>x.Company))]

let revenue=companies.map(c=>sum(d.filter(x=>x.Company==c),"Sales"))

create("companyRanking","bar",companies,revenue)

}

function buildHeatmap(d){

let centers=[...new Set(d.map(x=>x["Cost Center"]))]

let table="<tr><th>Cost Center</th><th>Margin</th></tr>"

centers.forEach(c=>{

let rows=d.filter(x=>x["Cost Center"]==c)

let sales=sum(rows,"Sales")

let profit=sales-sum(rows,"COGS")-sum(rows,"Operating Expenses")

let margin=(profit/sales)*100

table+=`<tr>
<td>${c}</td>
<td style="color:${margin>20?'#22c55e':'#ef4444'}">${margin.toFixed(1)}%</td>
</tr>`

})

heatTable.innerHTML=table

}

function showPage(id){

document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

function toggleMode(){

document.body.classList.toggle("light")

}

</script>

</body>
</html>
